<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Phonics Halli Galli — Coco</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&display=swap" rel="stylesheet" />
<style>
:root{
  color-scheme: light;
  /* 영상에서 샘플링: 무광 아쿠아 테이블, 나무 바닥, 장난감 같은 원색 */
  --floor-a: oklch(0.88 0.05 75);
  --floor-b: oklch(0.82 0.06 70);
  --table: oklch(0.86 0.055 208);
  --table-deep: oklch(0.8 0.06 210);
  --rim: oklch(0.8 0.065 212);
  --rim-side: oklch(0.68 0.07 215);
  --p1: oklch(0.64 0.09 268);
  --p1-deep: oklch(0.52 0.09 268);
  --p1-soft: oklch(0.82 0.05 255);
  --p2: oklch(0.7 0.13 14);
  --p2-deep: oklch(0.58 0.13 14);
  --p2-soft: oklch(0.86 0.06 14);
  --c-blue: oklch(0.93 0.03 240);
  --c-green: oklch(0.93 0.04 145);
  --c-cream: oklch(0.95 0.035 85);
  --c-pink: oklch(0.93 0.035 10);
  --paper: oklch(0.99 0.004 90);
  --bell: oklch(0.88 0.16 97);
  --bell-hi: oklch(0.96 0.09 100);
  --bell-low: oklch(0.74 0.15 82);
  --bell-base: oklch(0.64 0.17 24);
  --bell-base-deep: oklch(0.52 0.15 24);
  --chrome: oklch(0.82 0.01 250);
  --token: oklch(0.76 0.12 355);
  --token-deep: oklch(0.6 0.13 355);
  --logo-blue: oklch(0.76 0.11 232);
  --logo-pink: oklch(0.7 0.16 2);
  --ink: oklch(0.34 0.03 50);
  --ink-soft: oklch(0.5 0.03 60);
  --cast: oklch(0.45 0.06 215 / .35);
  --panel: oklch(1 0 0 / .9);
  --danger: oklch(0.6 0.2 25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    /* 저녁 조명: 같은 방, 조도만 낮춤 */
    --floor-a: oklch(0.4 0.04 60);
    --floor-b: oklch(0.32 0.04 55);
    --table: oklch(0.66 0.06 212);
    --table-deep: oklch(0.58 0.065 214);
    --rim: oklch(0.6 0.065 214);
    --rim-side: oklch(0.45 0.06 218);
    --paper: oklch(0.93 0.01 90);
    --cast: oklch(0.15 0.05 230 / .5);
    --panel: oklch(0.28 0.03 230 / .92);
    --ink-soft: oklch(0.42 0.03 60);
  }
  :root:not([data-theme="light"]) .verdict-card, :root:not([data-theme="light"]) .tag{ color: oklch(0.95 0.01 90); }
}

  :root[data-theme="dark"]{
    color-scheme: dark;
    /* 저녁 조명: 같은 방, 조도만 낮춤 */
    --floor-a: oklch(0.4 0.04 60);
    --floor-b: oklch(0.32 0.04 55);
    --table: oklch(0.66 0.06 212);
    --table-deep: oklch(0.58 0.065 214);
    --rim: oklch(0.6 0.065 214);
    --rim-side: oklch(0.45 0.06 218);
    --paper: oklch(0.93 0.01 90);
    --cast: oklch(0.15 0.05 230 / .5);
    --panel: oklch(0.28 0.03 230 / .92);
    --ink-soft: oklch(0.42 0.03 60);
  }
  :root[data-theme="dark"] .verdict-card, :root[data-theme="dark"] .tag{ color: oklch(0.95 0.01 90); }


*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
html,body{ height:100%; overflow:hidden; }
body{ font-family:"Jua","Fredoka",sans-serif; color:var(--ink); user-select:none; -webkit-user-select:none; touch-action:manipulation; }
button{ font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
button:focus-visible{ outline:4px solid oklch(0.95 0.13 95); outline-offset:4px; border-radius:2vh; }

.app{ position:fixed; inset:0; overflow:hidden;
  background: repeating-linear-gradient(100deg, var(--floor-a) 0 9vw, var(--floor-b) 9vw 9.3vw, var(--floor-a) 9.3vw 18vw); }

/* ── 테이블: 위에서 비스듬히 내려다보는 카메라 ── */
.scene{ position:absolute; inset:0; pointer-events:none; perspective: 1500px; perspective-origin: 50% -10%; }
.table{
  position:absolute; left:50%; top:56%; width: 86vw; height: 102vh;
  transform: translate(-50%,-50%) rotateX(40deg);
  transform-style: preserve-3d;
  border-radius: 7vh;
  background: var(--rim);
  box-shadow: 0 2.4vh 0 var(--rim-side), 0 7vh 9vh oklch(0.3 0.05 60 / .35);
  transition: transform 1.2s cubic-bezier(.3,.8,.2,1);
}
.felt{ position:absolute; inset: 3.4vh; border-radius: 5vh; transform-style: preserve-3d;
  background: radial-gradient(ellipse at 50% 45%, var(--table) 40%, var(--table-deep) 100%);
  box-shadow: inset 0 1vh 1.6vh oklch(0.4 0.06 215 / .25); }
[data-screen="title"] .table{ transform: translate(-50%,-50%) rotateX(40deg) scale(1.18); }

/* 판 위의 물건들: % = 테이블 좌표 */
.on{ position:absolute; transition: opacity .6s, translate .9s cubic-bezier(.3,.9,.3,1); }
[data-screen="title"] .game-only{ opacity:0; pointer-events:none; }
[data-screen="title"] .tray.p1, [data-screen="title"] .slots.p1{ translate: -30vw 0; }
[data-screen="title"] .tray.p2, [data-screen="title"] .slots.p2{ translate: 30vw 0; }

/* 플레이어 트레이 */
.tray{ top: 20%; height: 66%; width: 20%; border-radius: 3vh; padding: 2vh 1.8vh;
  display:grid; grid-template-rows: auto 1fr auto; justify-items:center; gap: 1.4vh; }
.tray.p1{ left: 3%; background: var(--p1); box-shadow: 0 1.4vh 0 var(--p1-deep), 1.6vh 3vh 2.6vh var(--cast); }
.tray.p2{ right: 3%; background: var(--p2); box-shadow: 0 1.4vh 0 var(--p2-deep), 1.6vh 3vh 2.6vh var(--cast); }
.tray .label{ font: 600 4.2vh/1 "Fredoka",sans-serif; color:#fff; letter-spacing:.02em; }
.tray .well{ width:100%; height:100%; border-radius:2vh; display:grid; place-items:center;
  background: oklch(1 0 0 / .18); box-shadow: inset 0 .8vh 1.4vh oklch(0.2 0.05 260 / .22); }
.tray .tag{ font-size: 3vh; padding: 1vh 2.6vh; border-radius:999px; background: var(--panel); white-space:nowrap;
  opacity:0; transition: opacity .25s; }
.tray.turn .tag{ opacity:1; }
.tray.turn{ outline: .8vh solid oklch(0.97 0.1 95); outline-offset: 1vh; }

/* 덱 (트레이 안 카드 더미) */
.deck{ position:relative; width: 72%; aspect-ratio: 3/4; }
.deck i{ position:absolute; inset:0; border-radius:1.6vh; background: var(--paper);
  box-shadow: 0 .4vh 0 oklch(0.85 0.01 90); }
.deck i:nth-child(1){ translate: 0 1.6vh; } .deck i:nth-child(2){ translate: 0 .8vh; }
.deck i:nth-child(3){ display:grid; place-items:center; padding: 1.2vh;
  background: var(--paper); }
.deck i:nth-child(3) b{ width:100%; height:100%; border-radius: 1vh; display:grid; place-items:center;
  font: 700 8vh/1 "Fredoka",sans-serif; color:#fff; }
.p1 .deck i:nth-child(3) b{ background: repeating-linear-gradient(45deg, var(--p1) 0 1.4vh, var(--p1-soft) 1.4vh 2.8vh); }
.p2 .deck i:nth-child(3) b{ background: repeating-linear-gradient(45deg, var(--p2) 0 1.4vh, var(--p2-soft) 1.4vh 2.8vh); }
.deck small{ position:absolute; left:0; right:0; bottom:-4.4vh; text-align:center; color:#fff; font-size:2.6vh; }
.tray:not(.turn) .deck{ filter: saturate(.6) brightness(.96); }
.deck.no{ animation: no .35s; }
@keyframes no{ 30%{ translate:-1vh 0;} 70%{ translate:1vh 0;} }

/* S 토큰 자리 */
.slots{ top: 34%; width: 7%; display:grid; gap: 2vh; }
.slots.p1{ left: 25%; } .slots.p2{ right: 25%; }
.slot{ position:relative; aspect-ratio:1; border-radius: 1.8vh; }
.p1 .slot{ background: color-mix(in oklch, var(--p1) 45%, transparent); }
.p2 .slot{ background: color-mix(in oklch, var(--p2) 45%, transparent); }
.token{ position:absolute; inset:10%; border-radius:50%; display:grid; place-items:center;
  font: 700 5.6vh/1 "Fredoka",sans-serif; color:#fff;
  background: radial-gradient(circle at 40% 35%, oklch(0.84 0.09 355), var(--token) 70%);
  box-shadow: 0 .9vh 0 var(--token-deep), .8vh 2vh 1.6vh var(--cast); }
.slot .token{ opacity:0; scale:.3; transition: opacity .2s, scale .35s cubic-bezier(.3,1.7,.5,1); }
.slot.has .token{ opacity:1; scale:1; }
.slot.lose .token{ animation: lose .45s forwards; }
@keyframes lose{ 0%{ opacity:1; scale:1;} 40%{ scale:1.3; } 100%{ opacity:0; scale:.2; translate:0 -4vh; } }
.minus{ position:absolute; left:50%; top:-8vh; translate:-50% 0; font: 700 6vh/1 "Fredoka",sans-serif; color: var(--danger);
  text-shadow: 0 .4vh 0 #fff; opacity:0; pointer-events:none; }
.minus.show{ animation: minus .9s ease-out; }
@keyframes minus{ 20%{ opacity:1; } 100%{ opacity:0; translate:-50% -5vh; } }

/* 가운데: 종, 카드 자리 */
.bell-spot{ left: 50%; top: 24%; width: 31vh; height: 31vh; translate: -50% 0; transition: top .9s cubic-bezier(.3,.9,.3,1), scale .9s; }
[data-screen="title"] .bell-spot{ top: 50%; scale: 1.25; }
.bell-shadow{ position:absolute; inset: 8% -6% -10% 6%; border-radius:50%;
  background: radial-gradient(ellipse, oklch(0.4 0.07 215 / .4), transparent 70%); }
.bell{ position:absolute; left:50%; bottom: 50%; width: 100%; aspect-ratio: 1/.95; translate: -50% 0;
  transform-origin: 50% 100%; transform: rotateX(-40deg); }
.bell .base{ position:absolute; left:0; right:0; bottom:0; height:36%; border-radius:50%;
  background: linear-gradient(to bottom, oklch(0.7 0.16 24), var(--bell-base) 45%, var(--bell-base-deep));
  box-shadow: inset 0 1vh 1vh oklch(0.78 0.12 24 / .7); }
.bell .base::after{ content:""; position:absolute; left:6%; right:6%; top:0; height:58%; border-radius:50%;
  background: oklch(0.72 0.15 24); }
.bell .dome{ position:absolute; left:12%; right:12%; bottom:20%; height:66%;
  border-radius: 50% 50% 44% 44% / 66% 66% 34% 34%;
  background: radial-gradient(circle at 34% 28%, var(--bell-hi) 0 8%, var(--bell) 34%, var(--bell-low) 100%);
  box-shadow: inset 0 -1.4vh 1.6vh oklch(0.6 0.13 75 / .45);
  transform-origin: 50% 100%; transition: scale .08s; }
.bell .knob{ position:absolute; left:50%; top:-14%; width:20%; height:22%; translate:-50% 0; }
.bell .knob::before{ content:""; position:absolute; left:35%; right:35%; top:40%; bottom:0; background: linear-gradient(90deg, oklch(0.7 0.01 250), var(--chrome), oklch(0.65 0.01 250)); }
.bell .knob::after{ content:""; position:absolute; inset:0 0 45% 0; border-radius:50%;
  background: radial-gradient(circle at 40% 35%, var(--bell-hi), var(--bell) 60%, var(--bell-low)); }
.face{ position:absolute; left:50%; top:52%; width:46%; translate:-50% 0; display:flex; justify-content:space-between; align-items:center;
  opacity:0; transition: opacity .5s; }
[data-screen="title"] .face{ opacity:1; }
.face i{ width:22%; aspect-ratio:1; border-radius:50%; background: oklch(0.25 0.03 50); box-shadow: inset .3vh .3vh 0 .1vh oklch(1 0 0 / .9); }
.face u{ width:26%; height:1.6vh; border: .45vh solid oklch(0.25 0.03 50); border-top:0; border-radius: 0 0 2vh 2vh; translate:0 1vh; }
.face s{ position:absolute; top:85%; width:18%; height:1.4vh; border-radius:50%; background: oklch(0.8 0.1 10 / .7); }
.face s:first-of-type{ left:-6%; } .face s:last-of-type{ right:-6%; }
.bell.hit .dome{ scale: 1 .9; }
.waves{ position:absolute; inset:-30% -40% 20%; pointer-events:none; }
.waves b{ position:absolute; top:10%; bottom:10%; width:30%; border: .8vh solid oklch(1 0 0 / .95); border-radius:50%; opacity:0; }
.waves b:nth-child(1){ left:0; border-right-color:transparent; border-top-color:transparent; border-bottom-color:transparent; }
.waves b:nth-child(2){ right:0; border-left-color:transparent; border-top-color:transparent; border-bottom-color:transparent; }
.bell.hit .waves b{ animation: wave .55s ease-out; }
@keyframes wave{ from{ opacity:1; scale:.7; } to{ opacity:0; scale:1.25; } }
.bell .side{ position:absolute; top:0; bottom:0; width:50%; border-radius: 999px; opacity:0; pointer-events:none; }
.bell .side.l{ left:-8%; background: radial-gradient(circle at 100% 60%, transparent 45%, var(--p1) 100%); }
.bell .side.r{ right:-8%; background: radial-gradient(circle at 0% 60%, transparent 45%, var(--p2) 100%); }
.bell.hit-l .side.l, .bell.hit-r .side.r{ animation: flash .5s; }
@keyframes flash{ from{ opacity:.8; } to{ opacity:0; } }

.spot, .bell-spot{ transform-style: preserve-3d; }
.spot{ left:50%; top: 58%; width: 30vh; aspect-ratio: 4/3.2; translate:-50% 0; border-radius: 2.4vh;
  border: .5vh dashed oklch(0.45 0.06 220 / .55); }
.spot .hint{ position:absolute; inset:0; display:grid; place-items:center; font-size: 2.8vh; color: oklch(0.42 0.06 220); }
.card{ position:absolute; left:50%; top:50%; width: 22vh; aspect-ratio: 3/4; translate:-50% -50%; transform-style: preserve-3d; }
.card .f{ position:absolute; inset:0; border-radius:1.8vh; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
.card .back{ rotate: y 180deg; background: var(--paper); padding:1.2vh; }
.card .back b{ display:block; height:100%; border-radius:1vh; background: repeating-linear-gradient(45deg, var(--bk) 0 1.4vh, var(--bks) 1.4vh 2.8vh); }
.card .front{ background: var(--paper); padding: 1.2vh; display:grid; grid-template-rows: 1fr auto; gap: .8vh;
  box-shadow: 0 .5vh 0 oklch(0.82 0.01 90), 1vh 2.4vh 2vh var(--cast); }
.card .art{ border-radius: 1vh; background: var(--tint); display:grid; place-content:center; text-align:center; gap:.4vh; padding:1vh;
  outline: .3vh dashed oklch(0.5 0.03 60 / .35); outline-offset: -1vh; }
.card .art small{ font-size: 1.9vh; color: var(--ink-soft); } .card .art strong{ font-size: 2.4vh; font-weight:400; }
.card .word{ text-align:center; font: 600 4.8vh/1.05 "Fredoka",sans-serif; color: var(--ink); padding-bottom:.4vh; }
.card.old{ filter: brightness(.95); }
.card .voice{ position:absolute; left:50%; top:-3.4vh; translate:-50% 0; display:flex; gap:.5vh; align-items:flex-end; height:4.4vh;
  padding: .9vh 1.6vh; border-radius:999px; background: var(--panel); box-shadow: 0 .8vh 1.4vh var(--cast); opacity:0; transition: opacity .2s; }
.card .voice i{ width:.8vh; height:30%; border-radius:.4vh; background: var(--p1); }
.card.talking .voice{ opacity:1; }
.card.talking .voice i{ animation: eq .5s ease-in-out infinite alternate; }
.card.talking .voice i:nth-child(2){ animation-delay:.15s; } .card.talking .voice i:nth-child(3){ animation-delay:.3s; }
@keyframes eq{ to{ height:100%; } }
.card.nopic .front{ grid-template-rows: 1fr; place-items:center; }
.card.nopic .word{ font-size: 6.6vh; }
.card.deal{ animation: deal .62s cubic-bezier(.2,.9,.25,1.05) both; }
@keyframes deal{
  0%{ transform: translate(var(--fx), -6vh) translateZ(8vh) rotateY(180deg) rotateZ(var(--fr)) scale(.8); }
  60%{ transform: translateZ(6vh) rotateY(-6deg) scale(1.04); }
  100%{ transform: none; }
}
.card.right .front{ box-shadow: 0 0 0 1vh var(--hitc), 0 0 5vh var(--hitc), 1vh 2.4vh 2vh var(--cast); }
.card.wrong{ animation: shake .4s; }
@keyframes shake{ 25%,75%{ translate:-60% -50%; } 50%{ translate:-40% -50%; } }

/* 3D 판 위 히트테스트는 브라우저마다 어긋나서, 화면 좌표에 투명 터치 영역을 겹친다 */
.hit{ position:fixed; z-index:4; border-radius:2vh; }
[data-screen="title"] .hit.d{ display:none; }

.replay{ display:flex; align-items:center; justify-content:center; font-size: 2.8vh; padding: 0 2.6vh; height: 6.4vh; border-radius:999px;
  background: var(--panel); box-shadow: 0 .6vh 0 oklch(0.7 0.04 220 / .6), 0 1.4vh 2vh var(--cast); }
.replay:disabled{ opacity:.4; }
.callout{ position:fixed; z-index:6; left:50%; top: 3vh; translate:-50% 0; font-size: 3.4vh; padding: 1.4vh 3.6vh; border-radius:999px;
  background: var(--panel); box-shadow: 0 1.4vh 2.4vh var(--cast); opacity:0; pointer-events:none; white-space:nowrap; }
.callout.show{ animation: callout 1.8s ease-out; }
@keyframes callout{ 0%{ opacity:0; translate:-50% -2vh; } 12%,75%{ opacity:1; translate:-50% 0; } 100%{ opacity:0; } }
.level{ position:absolute; right: 2.4vw; top: 2.4vh; max-width: 36vw; padding: 1vh; border-radius: 3vh; background: var(--panel); box-shadow: 0 1vh 2vh var(--cast); pointer-events:auto; display:grid; gap:.8vh; justify-items:center;
  padding: .8vh .8vh .8vh 2.4vh; border-radius:999px; background: var(--panel); font-size: 2.6vh; box-shadow: 0 1vh 2vh var(--cast); transition: opacity .4s; }
.level .row{ display:flex; gap:.8vh; }
.level button{ padding: 1vh 2.4vh; border-radius:2vh; display:grid; line-height:1.1; }
.level button small{ font-size: 2vh; opacity:.75; }
.level p{ font-size: 2.1vh; color: var(--ink-soft); padding: 0 1vh .4vh; text-align:center; line-height:1.35; }
.level-pill{ position:fixed; top: 3vh; right: 3vw; z-index:5; font-size: 2.6vh; padding: 1vh 2.4vh; border-radius:999px; background: var(--panel);
  box-shadow: 0 1vh 2vh var(--cast); transition: opacity .4s; }
[data-screen="title"] .level-pill{ opacity:0; }
.level button[aria-pressed="true"]{ background: var(--p2); color:#fff; }
[data-screen="game"] .level{ opacity:0; pointer-events:none; }

/* ── 타이틀 오버레이 ── */
.title{ position:absolute; inset:0; pointer-events:none; }
.logo{ position:absolute; left:50%; top:4vh; translate:-50% 0; text-align:center; transition: translate .8s cubic-bezier(.5,0,.7,.4), opacity .6s; }
.logo span{ display:block; font: 700 12vh/.95 "Fredoka",sans-serif; letter-spacing:.01em;
  paint-order: stroke fill; -webkit-text-stroke: 2.4vh oklch(0.98 0.01 90);
  filter: drop-shadow(0 1vh 0 oklch(0.85 0.02 230)) drop-shadow(0 2.4vh 2vh oklch(0.4 0.06 215 / .35)); }
.logo span:first-child{ color: var(--logo-blue); }
.logo span:last-child{ color: var(--logo-pink); }
.start{ position:absolute; left:50%; bottom:6vh; translate:-50% 0; pointer-events:auto;
  font: 700 5vh/1 "Fredoka",sans-serif; color:#fff; letter-spacing:.06em; padding: 2.2vh 8vh; border-radius:999px;
  background: linear-gradient(to bottom, oklch(0.74 0.15 10), var(--p2)); box-shadow: 0 1.2vh 0 var(--p2-deep), 0 3vh 3vh var(--cast);
  transition: opacity .4s; }
.start:active{ translate:-50% 1vh; box-shadow: 0 .3vh 0 var(--p2-deep); }
.fly{ position:absolute; width: 11vh; aspect-ratio:3/4; border-radius:1.2vh; background: var(--paper); padding:.9vh;
  box-shadow: 1.4vh 4vh 3vh var(--cast); animation: float var(--d) ease-in-out infinite alternate; transition: opacity .5s; }
.fly b{ display:block; height:100%; border-radius:.7vh; background: var(--t); }
@keyframes float{ from{ transform: translateY(0) rotate(var(--r)) rotateY(0); } to{ transform: translateY(-4vh) rotate(calc(var(--r) * -1)) rotateY(30deg); } }
[data-screen="game"] .logo{ translate:-50% -50vh; opacity:0; }
[data-screen="game"] .start, [data-screen="game"] .fly{ opacity:0; pointer-events:none; }

/* 결과 */
.verdict{ position:absolute; inset:0; display:none; place-items:center; z-index:8; background: oklch(0.3 0.04 220 / .3); }
.verdict.show{ display:grid; }
.verdict-card{ background: var(--panel); border-radius:5vh; padding: 5vh 8vh; text-align:center; box-shadow: 0 3vh 6vh var(--cast);
  animation: rise .5s cubic-bezier(.2,1.3,.4,1); }
@keyframes rise{ from{ translate: 0 8vh; scale:.9; opacity:0; } }
.verdict-card h2{ font: 700 10vh/1 "Fredoka","Jua",sans-serif; }
.verdict-card p{ font-size: 3vh; margin: 1.6vh 0 3.4vh; color: var(--ink-soft); }
.again{ font-size: 3.6vh; padding: 1.8vh 6vh; border-radius:999px; color:#fff;
  background: linear-gradient(to bottom, oklch(0.74 0.15 10), var(--p2)); box-shadow: 0 1vh 0 var(--p2-deep); }

.flyer{ position:fixed; z-index:9; width:8vh; height:8vh; pointer-events:none; }

/* ── Coco ──────────────────────────────────────
   같은 얼굴 리그(눈·입·볼)에 몸 모양만 바꿔 3가지 모습을 비교한다 */
.coco-spot{ right: 7%; top: 1%; width: 22vh; height: 18%; transform-style: preserve-3d; transition: opacity .6s, translate .9s cubic-bezier(.3,.9,.3,1); }
[data-screen="title"] .coco-spot{ opacity:0; translate: 24vw 0; }
.c-shadow{ position:absolute; left:12%; right:12%; bottom:-6%; height:34%; border-radius:50%;
  background: radial-gradient(ellipse, oklch(0.4 0.07 215 / .4), transparent 70%); }
.coco{ position:absolute; left:50%; bottom:20%; width: 19vh; height: 21vh; translate:-50% 0;
  transform-origin: 50% 100%; transform: rotateX(-40deg); --ink-c: oklch(0.25 0.03 30); }
.c-body{ position:absolute; left:0; right:0; bottom:0; height:82%; transform-origin: 50% 100%;
  animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe{ 50%{ scale: 1.02 .97; } }
.ear, .c-knob{ position:absolute; display:none; }

/* A 말랑곰 */
[data-look="bear"] .c-body{ border-radius: 50% 50% 44% 44% / 56% 56% 44% 44%;
  background: radial-gradient(circle at 34% 28%, oklch(0.88 0.08 18), var(--p2) 58%, var(--p2-deep) 100%);
  box-shadow: inset 0 -1.4vh 1.8vh oklch(0.45 0.12 14 / .35); }
[data-look="bear"] .ear{ display:block; top:-9%; width:30%; aspect-ratio:1; border-radius:50%;
  background: radial-gradient(circle at 40% 35%, oklch(0.84 0.09 16), var(--p2) 70%); }
[data-look="bear"] .ear::after{ content:""; position:absolute; inset:26%; border-radius:50%; background: oklch(0.9 0.06 12); }
[data-look="bear"] .ear.l{ left:4%; } [data-look="bear"] .ear.r{ right:4%; }

/* B 카드친구: 게임 카드 뒷면이 캐릭터가 됨 */
[data-look="card"] .c-body{ left:12%; right:12%; height:94%; border-radius: 2.4vh; rotate: -5deg;
  border: 1.5vh solid transparent;
  background: linear-gradient(var(--paper), var(--paper)) padding-box,
              repeating-linear-gradient(45deg, var(--p2) 0 1.1vh, var(--p2-soft) 1.1vh 2.2vh) border-box;
  box-shadow: 0 .6vh 0 oklch(0.82 0.01 90); }
[data-look="card"] .c-face{ left:8%; right:8%; }

/* C 꼬마종: 가운데 종의 동생 */
[data-look="bell"] .c-body{ left:10%; right:10%; height:70%; bottom:14%;
  border-radius: 50% 50% 42% 42% / 66% 66% 34% 34%;
  background: radial-gradient(circle at 34% 28%, oklch(0.94 0.05 15), oklch(0.8 0.1 12) 40%, var(--p2) 100%);
  box-shadow: inset 0 -1.2vh 1.4vh oklch(0.45 0.12 14 / .3); }
[data-look="bell"] .coco::before{ content:""; position:absolute; left:0; right:0; bottom:0; height:26%; border-radius:50%;
  background: linear-gradient(to bottom, var(--p2), var(--p2-deep)); z-index:0; }
[data-look="bell"] .c-body{ z-index:1; }
[data-look="bell"] .c-knob{ display:block; left:50%; top:-16%; width:18%; aspect-ratio:1; translate:-50% 0; border-radius:50%;
  background: radial-gradient(circle at 40% 35%, oklch(0.95 0.04 15), var(--p2)); }
[data-look="bell"] .c-face{ top:42%; }

/* 얼굴 리그 */
.c-face{ position:absolute; left:16%; right:16%; top:36%; height:36%; }
.eye{ position:absolute; top:0; width:22%; aspect-ratio:1; border-radius:50%; background: var(--ink-c);
  translate: var(--lx,0) var(--ly,0); transition: translate .25s, height .15s; animation: blink 4.6s infinite; }
.eye.l{ left:8%; } .eye.r{ right:8%; }
.eye b{ position:absolute; left:18%; top:16%; width:36%; aspect-ratio:1; border-radius:50%; background:#fff; }
@keyframes blink{ 0%,95%,100%{ scale:1 1; } 97%{ scale:1 .1; } }
.mouth{ position:absolute; left:50%; top:50%; width:20%; height:22%; translate:-50% 0;
  border: .5vh solid var(--ink-c); border-top:0; border-radius: 0 0 2vh 2vh; }
.blush{ position:absolute; top:44%; width:18%; height:16%; border-radius:50%; background: oklch(0.78 0.11 8 / .6); text-decoration:none; }
.blush.l{ left:-6%; } .blush.r{ right:-6%; }
.sweat{ position:absolute; right:-14%; top:-30%; width:14%; aspect-ratio:.7; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  background: oklch(0.85 0.08 230); opacity:0; }

[data-mood="think"]{ --lx: -.7vh; --ly: .6vh; }
[data-mood="think"] .mouth{ width:12%; height:0; border-radius:0; }
[data-mood="ready"] .eye{ scale:1.18; animation:none; }
[data-mood="ready"] .mouth{ width:10%; height:10%; border:.5vh solid var(--ink-c); border-radius:50%; }
[data-mood="happy"] .eye, [data-mood="cheer"] .eye{ background:none; aspect-ratio:auto; height:1.8vh; border:.6vh solid var(--ink-c); border-bottom:0; border-radius: 2vh 2vh 0 0; animation:none; }
[data-mood="happy"] .eye b, [data-mood="cheer"] .eye b{ display:none; }
[data-mood="happy"] .mouth, [data-mood="cheer"] .mouth{ width:26%; height:30%; background: var(--ink-c); border:0; border-radius: 0 0 3vh 3vh;
  box-shadow: inset 0 -.8vh 0 oklch(0.7 0.14 15); }
[data-mood="oops"] .eye{ aspect-ratio:auto; height:.7vh; top:20%; border-radius:.4vh; animation:none; }
[data-mood="oops"] .eye.l{ rotate: 18deg; } [data-mood="oops"] .eye.r{ rotate: -18deg; }
[data-mood="oops"] .eye b{ display:none; }
[data-mood="oops"] .mouth{ width:16%; height:0; border-bottom-style: dotted; border-radius:0; }
[data-mood="oops"] .sweat{ opacity:1; animation: drip 1s ease-in; }
@keyframes drip{ from{ translate:0 -1vh; opacity:0; } }
[data-mood="surprised"] .eye{ scale:1.25; animation:none; }
[data-mood="surprised"] .mouth{ width:14%; height:18%; border:.5vh solid var(--ink-c); border-radius:50%; }
[data-mood="sad"] .eye{ scale: 1 .6; translate: 0 .5vh; animation:none; }
[data-mood="sad"] .mouth{ top:60%; border-top:.5vh solid var(--ink-c); border-bottom:0; border-radius: 2vh 2vh 0 0; height:14%; }
[data-mood="sad"] .c-body{ animation:none; scale: 1.04 .93; }
[data-mood="happy"] .c-body{ animation: hop .45s 2; }
[data-mood="cheer"] .c-body{ animation: hop .55s infinite; }
[data-mood="oops"] .c-body{ animation: wobble .6s; }
.coco.lean .c-body{ animation: lean .32s; }
@keyframes hop{ 40%{ translate: 0 -2.4vh; scale:.96 1.05; } 80%{ translate:0 0; scale:1.05 .95; } }
@keyframes wobble{ 25%{ rotate:-7deg; } 75%{ rotate:7deg; } }
@keyframes lean{ 50%{ translate:-3vh .6vh; rotate:-14deg; } }

.bubble{ position:fixed; z-index:6; font-size: 3vh; padding: 1.2vh 2.4vh; border-radius: 2.4vh; background: var(--panel);
  box-shadow: 0 1.2vh 2vh var(--cast); white-space:nowrap; opacity:0; pointer-events:none; translate:-100% 0; }
.bubble::after{ content:""; position:absolute; right: 2.4vh; bottom:-1.4vh; border: 1.4vh solid transparent; border-top-color: var(--panel); border-bottom:0; }
.bubble.show{ animation: bub 1.9s ease-out; }
@keyframes bub{ 0%{ opacity:0; scale:.7; } 10%,80%{ opacity:1; scale:1; } 100%{ opacity:0; } }

.proto{ position:fixed; left: 2vw; top: 2.4vh; z-index:7; display:flex; align-items:center; gap:.6vh; font-size: 2.2vh;
  padding: .6vh .6vh .6vh 2vh; border-radius:999px; background: var(--panel); box-shadow: 0 1vh 2vh var(--cast); }
.proto button{ padding: .8vh 1.8vh; border-radius:999px; }
.proto button[aria-pressed="true"]{ background: var(--ink); color:#fff; }
.flyer .token{ inset:0; }

.rotate-msg{ display:none; position:fixed; inset:0; z-index:20; place-items:center; text-align:center; padding:8vw;
  background: var(--table); font-size: 6vw; }
@media (orientation: portrait){ .rotate-msg{ display:grid; } }
@media (prefers-reduced-motion: reduce){ .fly{ animation:none; } .card.deal{ animation-duration:.01s; } .table,.on,.logo{ transition:none; } }
</style>
</head>
<body>
<div class="app" id="app" data-screen="title">
  <div class="scene">
    <div class="table" id="table">
      <div class="felt">
        <section class="on tray p1" id="t0">
          <div class="label">나</div>
          <div class="well"><div class="deck"><i></i><i></i><i><b>s</b></i><small></small></div></div>
          <div class="tag">내 차례!</div>
        </section>
        <div class="on slots p1" id="s0">
          <div class="slot"><div class="token">S</div></div><div class="slot"><div class="token">S</div></div><div class="slot"><div class="token">S</div></div>
          <div class="minus">-S</div>
        </div>

        <section class="on tray p2" id="t1">
          <div class="label">Coco</div>
          <div class="well"><div class="deck"><i></i><i></i><i><b>s</b></i><small></small></div></div>
          <div class="tag">Coco 차례</div>
        </section>
        <div class="on slots p2" id="s1">
          <div class="slot"><div class="token">S</div></div><div class="slot"><div class="token">S</div></div><div class="slot"><div class="token">S</div></div>
          <div class="minus">-S</div>
        </div>

        <div class="on coco-spot" id="cocoSpot">
          <div class="c-shadow"></div>
          <div class="coco" id="coco" data-look="bear" data-mood="idle">
            <div class="c-body">
              <span class="ear l"></span><span class="ear r"></span><span class="c-knob"></span>
              <div class="c-face">
                <i class="eye l"><b></b></i><i class="eye r"><b></b></i>
                <u class="mouth"></u><s class="blush l"></s><s class="blush r"></s><em class="sweat"></em>
              </div>
            </div>
          </div>
        </div>
        <div class="on spot game-only" id="spot"><div class="hint">카드가 여기로 와요</div></div>

        <div class="on bell-spot">
          <div class="bell-shadow"></div>
          <div class="bell" id="bell">
            <span class="waves"><b></b><b></b></span>
            <span class="side l"></span><span class="side r"></span>
            <span class="base"></span>
            <span class="dome"><span class="knob"></span><span class="face"><s></s><i></i><u></u><i></i><s></s></span></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="hit d" id="hit0" aria-label="내 카드 넘기기"></button>
  <button class="hit" id="hitBell" aria-label="종 치기"></button>
  <div class="title">
    <div class="fly" style="left:12%;top:20%;--r:-14deg;--d:3.2s;--t:var(--c-green)"><b></b></div>
    <div class="fly" style="left:15%;top:55%;--r:10deg;--d:2.8s;--t:var(--c-pink)"><b></b></div>
    <div class="fly" style="left:73%;top:14%;--r:12deg;--d:3.6s;--t:var(--c-pink)"><b></b></div>
    <div class="fly" style="left:78%;top:48%;--r:-18deg;--d:3s;--t:var(--c-blue)"><b></b></div>
    <div class="fly" style="left:28%;top:70%;--r:-8deg;--d:3.4s;--t:var(--c-blue)"><b></b></div>
    <div class="fly" style="left:62%;top:68%;--r:16deg;--d:2.6s;--t:var(--c-cream)"><b></b></div>
    <div class="logo"><span>Phonics</span><span>Halli Galli</span></div>
    <button class="start" id="start">START</button>
    <div class="level" role="group" aria-label="단계 선택">
      <div class="row">
        <button data-lv="1" aria-pressed="true">1단계<small>5세</small></button>
        <button data-lv="2" aria-pressed="false">2단계<small>6세</small></button>
        <button data-lv="3" aria-pressed="false">3단계<small>7세</small></button>
      </div>
      <p id="lvDesc"></p>
    </div>
  </div>

  <button class="hit d replay" id="replay">다시 듣기</button>
  <div class="callout" id="callout"></div>
  <div class="bubble" id="bubble"></div>
  <div class="level-pill" id="lvPill"></div>
  <nav class="proto" role="group" aria-label="Coco 모습 (프로토타입)">
    <span>Coco 모습</span>
    <button data-look="bear" aria-pressed="true">말랑곰</button>
    <button data-look="card" aria-pressed="false">카드친구</button>
    <button data-look="bell" aria-pressed="false">꼬마종</button>
  </nav>
  <div class="verdict" id="verdict">
    <div class="verdict-card"><h2 id="vTitle"></h2><p id="vSub"></p><button class="again" id="again">다시 하기</button></div>
  </div>
  <div class="rotate-msg">태블릿을 가로로 눕혀<br>두 사람 사이에 놓아주세요</div>
</div>

<script>
// 단계별 단어 덱
const LEVELS = {
  1:{ name:'1단계 · 5세', desc:'-s 복수형 · 그림 보기 · Coco 느림', pic:true,
      cpu:{ react:[1800,2400], miss:.25, slip:.08, flip:2600 },
      words:[
        ['sun',0,'해 한 개'],['cats',1,'고양이 여러 마리'],['bed',0,'침대 한 개'],['map',0,'지도 한 장'],['dogs',1,'강아지 여러 마리'],
        ['egg',0,'달걀 한 개'],['hen',0,'암탉 한 마리'],['cups',1,'컵 여러 개'],['fan',0,'선풍기 한 대'],['lid',0,'뚜껑 한 개'],
        ['pens',1,'펜 여러 자루'],['mop',0,'대걸레 한 개'],['hats',1,'모자 여러 개'],['net',0,'그물 한 개'],['jam',0,'잼 한 병'],
        ['bugs',1,'벌레 여러 마리'],['web',0,'거미줄 한 개'],['pigs',1,'돼지 여러 마리'],['cap',0,'야구모자 한 개'],['bags',1,'가방 여러 개'] ] },
  2:{ name:'2단계 · 6세', desc:'같은 단어 짝 (cat / cats) · 그림 보기 · Coco 보통', pic:true,
      cpu:{ react:[1150,1550], miss:.12, slip:.06, flip:2200 },
      words:[
        ['cat',0,'고양이 한 마리'],['cats',1,'고양이 여러 마리'],['dog',0,'강아지 한 마리'],['dogs',1,'강아지 여러 마리'],
        ['cup',0,'컵 한 개'],['cups',1,'컵 여러 개'],['pen',0,'펜 한 자루'],['pens',1,'펜 여러 자루'],
        ['hat',0,'모자 한 개'],['hats',1,'모자 여러 개'],['bug',0,'벌레 한 마리'],['bugs',1,'벌레 여러 마리'],
        ['pig',0,'돼지 한 마리'],['pigs',1,'돼지 여러 마리'],['bag',0,'가방 한 개'],['bags',1,'가방 여러 개'],
        ['bed',0,'침대 한 개'],['beds',1,'침대 여러 개'],['map',0,'지도 한 장'],['maps',1,'지도 여러 장'] ] },
  3:{ name:'3단계 · 7세', desc:'-es 복수형 + s로 끝나는 단수 함정 · 그림 없이 · Coco 빠름', pic:false,
      cpu:{ react:[750,1050], miss:.05, slip:.04, flip:1900 },
      words:[
        ['box',0],['boxes',1],['fox',0],['foxes',1],['dish',0],['dishes',1],['bench',0],['benches',1],
        ['watch',0],['watches',1],['bus',0],['buses',1],['glass',0],['dress',0],['cats',1],['cups',1],
        ['hats',1],['egg',0],['lid',0],['sun',0] ] }
};
const TINTS = ['var(--c-blue)','var(--c-green)','var(--c-cream)','var(--c-pink)'];
const ME=0, CPU=1;
const $ = s => document.querySelector(s);
const app=$('#app'), bell=$('#bell'), spot=$('#spot'), coco=$('#coco');
const P=[0,1].map(i=>({ tray:$('#t'+i), slots:[...$('#s'+i).querySelectorAll('.slot')],
  deck:$('#t'+i).querySelector('.deck'), minus:$('#s'+i).querySelector('.minus'), score:0 }));
let level=1, deck, turn, cur, over, lockUntil, timers=[], moodTimer;

const L=()=>LEVELS[level];
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
const rand=([a,b])=>a+Math.random()*(b-a);
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
const newDeck=()=>shuffle(L().words.map(([w,p,a])=>({w,p:!!p,a})));

// Coco 표정과 말풍선
function mood(m, ms){ clearTimeout(moodTimer); coco.dataset.mood=m; if(ms) moodTimer=setTimeout(()=>{ if(!over) coco.dataset.mood='idle'; }, ms); }
function cocoSay(text){ const b=$('#bubble'), r=coco.getBoundingClientRect();
  b.textContent=text; b.style.left=(r.left+r.width*.55)+'px'; b.style.top=(r.top-b.offsetHeight-14)+'px';
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }
function lean(){ coco.classList.remove('lean'); void coco.offsetWidth; coco.classList.add('lean'); }

function reset(){
  clearTimers(); deck=newDeck(); cur=null; over=false; lockUntil=0;
  P.forEach(p=>{ p.score=0; p.slots.forEach(s=>s.className='slot'); });
  spot.querySelectorAll('.card').forEach(c=>c.remove()); spot.querySelector('.hint').style.display='';
  $('#verdict').classList.remove('show'); $('#replay').disabled=true; $('#lvPill').textContent=L().name;
  mood('idle'); setTurn(ME); counts();
}
function setTurn(t){ turn=t; P.forEach((p,i)=>p.tray.classList.toggle('turn', i===t && !over && app.dataset.screen==='game')); }
function counts(){ P.forEach(p=>p.deck.querySelector('small').textContent = deck.length+'장'); }
function say(text){ const c=$('#callout'); c.textContent=text; c.classList.remove('show'); void c.offsetWidth; c.classList.add('show'); }

// 소리
let ac; const ctx=()=> ac = ac || new (window.AudioContext||window.webkitAudioContext)();
function tone(fs,d,type='sine',g0=.22){ try{ const c=ctx(), g=c.createGain(); g.gain.setValueAtTime(g0,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d); g.connect(c.destination);
  fs.forEach(f=>{ const o=c.createOscillator(); o.type=type; o.frequency.value=f; o.connect(g); o.start(); o.stop(c.currentTime+d); }); }catch(e){} }
const ding=()=>tone([1760,2640,3520],1.1), buzz=()=>tone([170,182],.35,'triangle',.2);
// ── 단어 읽어주기 ──
// iOS/iPadOS는 첫 음성을 반드시 사용자 터치 안에서 시작해야 이후 자동 재생이 된다 → START에서 잠금 해제
const TTS = 'speechSynthesis' in window;
let voice=null, ttsReady=false;
function loadVoices(){ if(!TTS) return; const vs=speechSynthesis.getVoices();
  voice = vs.find(v=>/en[-_]US/i.test(v.lang) && /Samantha|Ava|Allison|Google US English|Aria|Jenny|Nicky/i.test(v.name))
       || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }
if(TTS){ loadVoices(); speechSynthesis.addEventListener?.('voiceschanged', loadVoices); }
function unlockSpeech(){ if(!TTS || ttsReady) return; ttsReady=true;
  try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }catch(e){} }
function talking(on){ if(cur && cur.el) cur.el.classList.toggle('talking', on); }
function speak(w){
  if(!TTS){ say('이 기기에서는 읽어주기가 지원되지 않아요'); return; }
  if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
  setTimeout(()=>{   // cancel 직후 바로 speak하면 Safari에서 소리가 씹히는 문제 회피
    const u=new SpeechSynthesisUtterance(w);
    if(!voice) loadVoices();
    if(voice) u.voice=voice; u.lang = voice ? voice.lang : 'en-US';
    u.rate=.78; u.pitch=1.08; u.volume=1;
    u.onstart=()=>talking(true); u.onend=u.onerror=()=>talking(false);
    speechSynthesis.speak(u); speechSynthesis.resume();   // Chrome이 오래 쉬면 일시정지되는 문제 회피
  }, 60);
}

function flip(i){
  if(over || app.dataset.screen!=='game') return;
  const p=P[i];
  if(i!==turn){ p.deck.classList.remove('no'); void p.deck.offsetWidth; p.deck.classList.add('no'); return; }
  clearTimers();
  if(!deck.length) deck=newDeck();
  const c=deck.shift(); cur={...c, done:false, wrong:new Set()};
  spot.querySelector('.hint').style.display='none';
  spot.querySelectorAll('.card').forEach((o,k,all)=>{ o.classList.remove('deal','right','wrong'); o.classList.add('old');
    if(!o.style.rotate) o.style.rotate=(Math.random()*16-8)+'deg'; if(all.length>2 && k===0) o.remove(); });
  const el=document.createElement('div'); el.className='card deal'+(L().pic?'':' nopic');
  el.style.setProperty('--fx', i? '60vh':'-60vh'); el.style.setProperty('--fr', i? '20deg':'-20deg');
  el.style.setProperty('--bk', i? 'var(--p2)':'var(--p1)'); el.style.setProperty('--bks', i? 'var(--p2-soft)':'var(--p1-soft)');
  const art = L().pic ? `<div class="art" style="--tint:${TINTS[Math.random()*4|0]}"><small>그림 자리</small><strong>${c.a}</strong></div>` : '';
  el.innerHTML=`<div class="f front">${art}<div class="word">${c.w}</div><span class="voice" aria-hidden="true"><i></i><i></i><i></i></span></div><div class="f back"><b></b></div>`;
  spot.appendChild(el); cur.el=el; $('#replay').disabled=false;
  counts(); setTimeout(()=>speak(c.w), 350);
  mood('think');
  cpuReact(cur);
  setTurn(1-turn);
  if(turn===CPU) later(()=>flip(CPU), L().cpu.flip);
}
// Coco는 카드가 열린 뒤 단계별 반응 시간만큼 생각하다 판단한다
function cpuReact(card){
  const C=L().cpu, t=400+rand(C.react);
  const go=()=>{ if(cur!==card || card.done || over) return; mood('ready'); later(()=>{ if(cur===card && !card.done && !over){ lean(); hitBell(CPU); } }, 220); };
  if(card.p && Math.random()>C.miss) later(go, t);
  else if(!card.p && Math.random()<C.slip) later(go, t);
  else later(()=>{ if(cur===card && !over) mood('idle'); }, t);
}
function hitBell(who){
  bell.classList.remove('hit','hit-l','hit-r'); void bell.offsetWidth;
  bell.classList.add('hit'); if(app.dataset.screen==='game') bell.classList.add(who?'hit-r':'hit-l');
  ding();
  if(app.dataset.screen!=='game' || over || !cur) return;
  if(cur.done){ if(who===ME && performance.now()<lockUntil+900) say('Coco가 먼저 쳤어요!'); return; }
  if(performance.now()<lockUntil) return;
  const p=P[who];
  if(cur.p){
    cur.done=true; lockUntil=performance.now()+500;
    repeatWord(cur);
    cur.el.style.setProperty('--hitc', who? 'oklch(0.85 0.1 14)':'oklch(0.85 0.07 260)');
    cur.el.classList.add('right');
    if(who===CPU){ mood('happy',1400); cocoSay(`${cur.w}! 여러 개야`); }
    else { mood('surprised',1200); cocoSay('와, 빠르다!'); }
    fly(p.slots[p.score]); p.score++;
    if(p.score===3) end(who);
  }else{
    if(cur.wrong.has(who)) return; cur.wrong.add(who); buzz();
    repeatWord(cur);
    if(who===ME) say('한 개일 땐 종을 치지 않아요');
    else { mood('oops',1500); cocoSay(`앗, ${cur.w}은 한 개였네!`); }
    cur.el.classList.remove('wrong'); void cur.el.offsetWidth; cur.el.classList.add('wrong');
    p.minus.classList.remove('show'); void p.minus.offsetWidth; p.minus.classList.add('show');
    if(p.score>0){ p.score--; const s=p.slots[p.score]; s.className='slot has lose'; setTimeout(()=>s.className='slot',450); }
  }
}
// 종을 친 뒤 종소리가 잦아들 즈음 같은 단어를 한 번 더 읽어준다 (맞았든 틀렸든)
function repeatWord(card){ setTimeout(()=>{ if(cur===card) speak(card.w); }, 650); }
function fly(target){
  const a=cur.el.getBoundingClientRect(), b=target.getBoundingClientRect();
  const f=document.createElement('div'); f.className='flyer'; f.innerHTML='<div class="token">S</div>'; document.body.appendChild(f);
  const h=f.offsetWidth/2, sx=a.left+a.width/2-h, sy=a.top+a.height/2-h, ex=b.left+b.width/2-h, ey=b.top+b.height/2-h;
  f.animate([{transform:`translate(${sx}px,${sy}px) scale(.5)`},
    {transform:`translate(${(sx+ex)/2}px,${Math.min(sy,ey)-90}px) scale(1.4)`, offset:.45},
    {transform:`translate(${ex}px,${ey}px) scale(.9)`}], {duration:720, easing:'cubic-bezier(.3,.7,.3,1)'})
   .onfinish=()=>{ f.remove(); target.className='slot has'; };
}
function end(w){
  over=true; clearTimers(); setTurn(turn);
  // Coco는 이겨도 져도 다음 판을 권한다 (놀리지 않는 상대)
  setTimeout(()=>{ if(w===CPU){ mood('cheer'); cocoSay('내가 이겼다! 한 판 더 할래?'); }
                   else { mood('sad'); cocoSay('으앗, 네가 이겼어!'); setTimeout(()=>{ if(over) mood('happy'); }, 1300); } }, 300);
  setTimeout(()=>{ const h=$('#vTitle');
    h.textContent = w===ME ? '이겼다!' : '아쉬워요!'; h.style.color = w===ME ? 'var(--p1)' : 'var(--p2)';
    $('#vSub').textContent = w===ME ? 'Coco보다 먼저 S 3개를 모았어요' : 'Coco가 먼저 모았어요. 다시 도전해요!';
    $('#verdict').classList.add('show'); $('#again').focus(); }, 2200);
}

// 3D 판 위 히트테스트 대신 화면 좌표 터치 영역
function place(){
  const set=(hit,r,pad=0)=>Object.assign(hit.style,{left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
  set($('#hit0'),P[ME].deck.getBoundingClientRect(),10);
  set($('#hitBell'),bell.getBoundingClientRect(),8);
  const s=spot.getBoundingClientRect(), rp=$('#replay');
  Object.assign(rp.style,{left:(s.right+16)+'px', top:(s.top+s.height/2-rp.offsetHeight/2)+'px', width:'auto', height:''});
}
function follow(ms){ const t0=performance.now(); (function f(){ place(); if(performance.now()-t0<ms) requestAnimationFrame(f); })(); }
addEventListener('resize', place);
$('#hit0').addEventListener('click', ()=>{ unlockSpeech(); flip(ME); });
const hb=$('#hitBell');
hb.addEventListener('pointerdown', e=>{ e.preventDefault(); hitBell(ME); });
hb.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); hitBell(ME); } });
$('#replay').addEventListener('click', ()=>{ unlockSpeech(); cur && speak(cur.w); });
function pickLevel(v){ level=+v; $('#lvDesc').textContent=L().desc;
  document.querySelectorAll('.level button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.lv===String(v))); }
document.querySelectorAll('.level button').forEach(b=>b.addEventListener('click', ()=>pickLevel(b.dataset.lv)));
document.querySelectorAll('.proto button').forEach(b=>b.addEventListener('click', ()=>{
  coco.dataset.look=b.dataset.look; document.querySelectorAll('.proto button').forEach(x=>x.setAttribute('aria-pressed', x===b)); }));
$('#start').addEventListener('click', ()=>{ unlockSpeech(); app.dataset.screen='game'; ctx(); reset(); follow(1500); setTimeout(()=>{ mood('happy',1200); cocoSay('안녕! 나는 Coco야'); }, 1100); });
$('#again').addEventListener('click', reset);
document.addEventListener('keydown', e=>{ if(e.target.closest('button')) return;
  if(e.key===' '){ e.preventDefault(); hitBell(ME); } if(e.key==='Enter') flip(ME); });
pickLevel(1); reset(); follow(600);
</script>
</body>
